[phases.build]
cmds = [
  "pip install -r requirements.txt",
  "python manage.py collectstatic --noinput",
]

[start]
# 2 workers x 4 threads = 8 concurrent requests. The app is I/O-bound (DB round
# trips), so threads let other requests run while one waits on Postgres — without
# this (gunicorn's 1-worker/1-thread default) every request is served serially and
# the polling load saturates the single thread.
cmd = "python manage.py migrate --noinput && gunicorn tt_back.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60"
